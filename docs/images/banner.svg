<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Nocta</title>
  <desc id="desc">A desktop app for managing and launching many Roblox accounts.</desc>
  <defs>
    <radialGradient id="glow" cx="78%" cy="40%" r="60%">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#111111"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111111" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#111111" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "Cascadia Code", "JetBrains Mono", Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="360" rx="18" fill="url(#glow)"/>
  <rect width="1280" height="360" rx="18" fill="url(#dots)"/>

  <!-- Client windows, each with its account and stage -->
  <g transform="translate(720 54)">
    <g transform="translate(150 0)">
      <rect width="360" height="132" rx="10" fill="#141414" stroke="#232323"/>
      <rect width="360" height="26" rx="10" fill="#181818"/>
      <circle cx="16" cy="13" r="4" fill="#3a3a3a"/>
      <text x="30" y="17.5" class="sans" font-size="11" fill="#5a5a5a">Roblox · Alt_03</text>
      <rect x="18" y="46" width="200" height="8" rx="4" fill="#1f1f1f"/>
      <rect x="18" y="64" width="140" height="8" rx="4" fill="#1f1f1f"/>
      <rect x="18" y="96" width="74" height="20" rx="10" fill="#2b2618"/>
      <text x="30" y="110" class="sans" font-size="11" fill="#8a7752">joining</text>
    </g>
    <g transform="translate(75 62)">
      <rect width="360" height="132" rx="10" fill="#161616" stroke="#2a2a2a"/>
      <rect width="360" height="26" rx="10" fill="#1c1c1c"/>
      <circle cx="16" cy="13" r="4" fill="#3a3a3a"/>
      <text x="30" y="17.5" class="sans" font-size="11" fill="#7a7a7a">Roblox · Farm (Alt_02)</text>
      <rect x="18" y="46" width="230" height="8" rx="4" fill="#262626"/>
      <rect x="18" y="64" width="170" height="8" rx="4" fill="#262626"/>
      <rect x="18" y="96" width="74" height="20" rx="10" fill="#18261f"/>
      <text x="31" y="110" class="sans" font-size="11" fill="#7fb39a">in game</text>
    </g>
    <g transform="translate(0 124)">
      <rect width="360" height="132" rx="10" fill="#1a1a1a" stroke="#353535"/>
      <rect width="360" height="26" rx="10" fill="#1f1f1f"/>
      <circle cx="16" cy="13" r="4" fill="#7fb39a"/>
      <text x="30" y="17.5" class="sans" font-size="11" fill="#c5c5c5">Roblox · Main (Alt_01)</text>
      <rect x="18" y="46" width="250" height="8" rx="4" fill="#2a2a2a"/>
      <rect x="18" y="64" width="180" height="8" rx="4" fill="#2a2a2a"/>
      <rect x="18" y="96" width="74" height="20" rx="10" fill="#18261f"/>
      <text x="31" y="110" class="sans" font-size="11" fill="#7fb39a">in game</text>
      <text x="200" y="110" class="mono" font-size="11" fill="#8a8a8a">2 h 15 min · 15 fps</text>
    </g>
  </g>

  <rect width="1280" height="360" rx="18" fill="url(#fade)"/>

  <!-- Mark and name -->
  <g transform="translate(88 104)">
    <rect width="64" height="64" rx="14" fill="#1c1c1c" stroke="#333333"/>
    <path d="M5 19 9 5l6 14 4-14M7 13l10-2" transform="translate(8 8) scale(2)" fill="none" stroke="#e5e5e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="172" y="156" class="sans" font-size="58" font-weight="600" fill="#f5f5f5" letter-spacing="-1">Nocta</text>
  <text x="90" y="214" class="sans" font-size="22" fill="#b5b5b5">Manage and launch many Roblox accounts.</text>
  <text x="90" y="250" class="sans" font-size="16" fill="#7a7a7a">Sessions · Launching · Client upkeep · Automation</text>
  <text x="90" y="300" class="sans" font-size="14" fill="#5f5f5f">by 7moons.dev</text>
</svg>
