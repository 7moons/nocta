[package]
name = "nocta-core"
description = "Nocta's domain logic: storage, accounts, sessions and the Roblox launcher."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tokio-tungstenite = "0.29"
ts-rs = { version = "12", features = ["serde-compat"] }
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
md-5 = "0.10"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
crypto_secretbox = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Power", "Win32_System_Memory", "Win32_UI_Accessibility"] }

[dev-dependencies]
tempfile = "3"
