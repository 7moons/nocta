# Builds a release on Windows and publishes it on GitHub, where nocta.7moons.dev picks it up
# (it shows the latest published release: the installer, the portable zip and SHA256SUMS.txt).
#
# Start it by pushing a tag that matches the version in package.json, tauri.conf.json and
# Cargo.toml, e.g. `git tag v1.0.1 && git push origin v1.0.1`, or run it by hand for an existing tag.
# Release notes come from that version's section in CHANGELOG.md.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v1.0.0
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Chrome for Testing build bundled as runtime/chrome. Bump it on purpose, never "latest".
  CHROME_VERSION: 157.0.8103.50

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Tag matches the app version
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $TAG is not vX.Y.Z"; exit 1; }
          v=${TAG#v}
          pkg=$(node -p 'require("./package.json").version')
          conf=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [[ $pkg == "$v" && $conf == "$v" && $cargo == "$v" ]] ||
            { echo "::error::tag $v, package.json $pkg, tauri.conf.json $conf, Cargo.toml $cargo"; exit 1; }
          awk -v v="$v" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" ||
            { echo "::error::CHANGELOG.md has no section for [$v]"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: bun install --frozen-lockfile

      - name: Stage the bundled browser
        run: |
          zip="$RUNNER_TEMP/chrome-win64.zip"
          curl -fsSL --retry 3 -o "$zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/win64/chrome-win64.zip"
          unzip -q "$zip" -d "$RUNNER_TEMP/cft"
          node scripts/stage-browser.mjs "$RUNNER_TEMP/cft/chrome-win64" "$CHROME_VERSION"
          bun run runtime:manifest

      - name: Build
        run: bun run release

      - name: Publish
        run: |
          out=$(ls -d release/"$VERSION"-win32-x64-*/ | tail -1)
          files=("$out"installer/Nocta_"$VERSION"_x64-setup.exe
                 "$out"Nocta-"$VERSION"-windows-x64-portable.zip
                 "$out"SHA256SUMS.txt)
          ls -l "${files[@]}"
          cat "$out"SHA256SUMS.txt
          gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Nocta $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest
